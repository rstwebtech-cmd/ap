<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Admin</title>
<style>body{font-family:sans-serif;max-width:900px;margin:auto;padding:12px}button{margin:2px;padding:7px 12px}input,textarea,select{width:100%;padding:7px;margin:3px 0;box-sizing:border-box}.c{border:1px solid #ccc;border-radius:8px;padding:10px;margin:8px 0}nav button{background:#6a1b9a;color:#fff;border:0;border-radius:6px}</style>
<h2>👑 Janhavi Panwar - Admin</h2>
<div id=lg><input id=k type=password placeholder="Admin Key (Render > Environment > ADMIN_KEY)"><button onclick=ent()>Login</button></div>
<div id=ap hidden><nav><button onclick=rev()>Reviews</button><button onclick=crs()>Courses & Offers</button><button onclick=stu()>Students / Send</button><button onclick=ord()>Payments</button><button onclick=set()>Settings</button></nav><div id=v></div></div>
<script>
let K='',C=[],U={};const $=i=>document.getElementById(i);
async function A(m,p,b){const r=await fetch(p,{method:m,headers:{'X-Admin-Key':K,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return r.json()}
async function ent(){K=$('k').value;const r=await A('GET','/api/admin/students');if(r.error)return alert('Wrong key');$('lg').hidden=true;$('ap').hidden=false;rev()}
async function rev(){const l=await A('GET','/api/admin/reviews');$('v').innerHTML='<h3>Reviews</h3>'+(l||[]).map(r=>`<div class=c><b>${r.Name}</b> ⭐${r.Stars}<br>${r.Text}<br>${r.Approved?'✅ Approved':`<button onclick="ap('${r.ID}')">Approve</button>`}</div>`).join('')||'No reviews'}
async function ap(i){await A('POST','/api/admin/reviews/'+i+'/approve');rev()}
async function crs(){C=await (await fetch('/api/courses')).json();$('v').innerHTML='<h3>Courses & Offers</h3><button onclick=addc()>+ New course</button>'+C.map((c,i)=>`<div class=c><b>${c.Title}</b><input value="${c.Title}" oninput="C[${i}].Title=this.value">Price <input type=number value=${c.Price} oninput="C[${i}].Price=+this.value">MRP <input type=number value=${c.MRP} oninput="C[${i}].MRP=+this.value">Offer label <input value="${c.OfferLabel||''}" oninput="C[${i}].OfferLabel=this.value">Offer ends (2026-12-31T23:59:00+05:30) <input value="${c.OfferEnds||''}" oninput="C[${i}].OfferEnds=this.value"><button onclick="sc(${i})">Save</button></div>`).join('')}
async function sc(i){await A('POST','/api/admin/courses',C[i]);alert('Saved')}
async function addc(){await A('POST','/api/admin/courses',{Title:'New Course',Category:'English',Duration:'0m',Price:999,MRP:1999});crs()}
async function stu(){U=await A('GET','/api/admin/students');$('v').innerHTML='<h3>Students ('+Object.keys(U).length+')</h3><p>Kisi ko tick nahi kiya to SAB ko jaayega</p>'+Object.values(U).map(u=>`<label><input type=checkbox style="width:auto" class=sel value="${u.ID}"> ${u.Name||'-'} | ${u.Phone||''} | ${u.Email||''}</label><br>`).join('')+'<select id=ch><option value=whatsapp>WhatsApp</option><option value=email>Email</option></select><input id=sb placeholder="Subject (email)"><textarea id=ms rows=4 placeholder="Message"></textarea><button onclick=snd()>Send</button>'}
async function snd(){const ids=[...document.querySelectorAll('.sel:checked')].map(x=>x.value);const r=await A('POST','/api/admin/broadcast',{Channel:$('ch').value,Subject:$('sb').value,Message:$('ms').value,UserIDs:ids});alert('Queued: '+r.queued)}
async function ord(){const o=await A('GET','/api/admin/orders');$('v').innerHTML='<h3>Payments</h3>'+Object.values(o||{}).map(x=>`<div class=c>₹${x.Amount} | ${x.Paid?'✅ PAID':'⏳ pending'} | item ${x.Item}</div>`).join('')||'None'}
const F=[['rz_key_id','Razorpay Key ID'],['rz_key_secret','Razorpay Key Secret'],['smtp_host','SMTP host (smtp.gmail.com)'],['smtp_port','SMTP port (587)'],['smtp_user','SMTP email'],['smtp_pass','SMTP app password'],['wa_url','WhatsApp API URL'],['wa_token','WhatsApp API token']];
function set(){$('v').innerHTML='<h3>API Keys / Settings</h3>'+F.map(f=>`<label>${f[1]}<input id=${f[0]} type=password></label>`).join('')+'<button onclick=ss()>Save</button><p>Sirf wahi bharo jo badalna hai.</p>'}
async function ss(){const b={};F.forEach(f=>{if($(f[0]).value)b[f[0]]=$(f[0]).value});await A('PUT','/api/admin/settings',b);alert('Saved')}
</script>
